# Site-owned override of the Chirpy 7.6.0 `_data/locales/en.yml` UI strings.
#
# Jekyll gives this file precedence over the theme's copy. It is an exact copy of
# upstream `_data/locales/en.yml` from jekyll-theme-chirpy 7.6.0 with ONE change:
# the `copyright` block describes this product's MIT licensing instead of the
# theme default CC BY 4.0. See THIRD_PARTY_NOTICES.md.
#
# Every other key must stay in step with the pinned theme version.

# The layout text of site

# ----- Commons label -----

layout:
  post: Post
  category: Category
  tag: Tag

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Home
  categories: Categories
  tags: Tags
  archives: Archives
  about: About

# the text displayed in the search bar & search results
search:
  hint: search
  cancel: Cancel
  no_results: Oops! No results found.

panel:
  lastmod: Recently Updated
  trending_tags: Trending Tags
  toc: Contents

copyright:
  # Shown at the bottom of the post
  license:
    template: This post is licensed under :LICENSE_NAME by the author.
    name: MIT
    link: https://opensource.org/licenses/MIT

  # Displayed in the footer
  brief: Licensed under MIT.
  verbose: >-
    Except where otherwise noted, the source of this site and the blog posts on
    this site are licensed under the MIT License by Heretical Solutions. See the
    LICENSE file and the licenses/ directory of the source repository.

meta: Using the :THEME theme for :PLATFORM.

not_found:
  statement: Sorry, we've misplaced that URL or it's pointing to something that doesn't exist.

notification:
  update_found: New content available
  update: Update

theme:
  light: Light
  dark: Dark
  system: System

# ----- Posts related labels -----

post:
  written_by: By
  posted: Posted
  updated: Updated
  words: words
  pageview_measure: views
  read_time:
    unit: min
    prompt: read
  edit: Edit this post
  relate_posts: Further Reading
  share: Share
  button:
    next: Newer
    previous: Older
    copy_code:
      succeed: Copied!
    share_link:
      title: Copy link
      succeed: Link copied successfully!

# Date time format.
# See: <http://strftime.net/>, <https://dayjs.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure:
    singular: category
    plural: categories
  post_measure:
    singular: post
    plural: posts
